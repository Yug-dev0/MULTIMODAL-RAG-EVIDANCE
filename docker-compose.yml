services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragdb
      POSTGRES_PASSWORD: ragdb
      POSTGRES_DB: ragdb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/ragdb_neo4j
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4jdata:/data"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Override the .env defaults (meant for local-venv dev against
      # localhost) with in-network service hostnames.
      POSTGRES_URL: postgresql+asyncpg://ragdb:ragdb@postgres:5432/ragdb
      NEO4J_URI: bolt://neo4j:7687
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./data/media:/app/data/media"]
    depends_on: [postgres, neo4j]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [backend]
volumes:
  pgdata:
  neo4jdata:
